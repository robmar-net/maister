name: Wiki census check (Parity-Map header)

# The Parity-Map header census ("✅ N verified · 🟢 N adapted · …") is GENERATED from the page's
# own tables by l2/tools/parity-header.mjs (#92 Stage 6; unit = one table row). A hand edit to the
# wiki can silently drift the counters away from the tables, so this workflow re-checks the live
# wiki page whenever the wiki changes (`gollum` fires on wiki page create/update and runs from the
# default branch) and on demand. Read-only, credit-free, no Copilot seat involved.
#
# The daily cron is the backstop for the main edit path: `gollum` fires on WEB-UI wiki edits only —
# observed 2026-09-03: three `git push`es to the wiki repo triggered zero gollum runs.

on:
  gollum:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *' # daily backstop — git pushes to the wiki do not fire gollum

# Least privilege: reads the repo for the tool, clones the public wiki — no writes.
permissions:
  contents: read

jobs:
  census:
    name: Parity-Map header matches its tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Node 24 for parity with l2-check.yml (the tool itself is node:builtins-only).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # The wiki is a separate public repo; a shallow anonymous clone is enough (read-only).
      - name: Clone the wiki
        run: git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/wiki

      # The same guards scripts/wiki.sh runs before every publish (#148): G1 the Parity-Map header
      # census matches its tables, G2 every bundle CLI version has a Matrix row (no bundles on the
      # runner — trivially green here; it bites locally), G3 every docs/adr/NNNN-*.md is linked from
      # Home, G4 clone freshness (warning only). Exit non-zero on any guard failure.
      - name: scripts/wiki.sh check
        run: |
          bash scripts/wiki.sh check /tmp/wiki \
            || { echo "::error::wiki guards failed — see the G1/G2/G3 lines above; fix the page and republish via scripts/wiki.sh publish"; exit 1; }
