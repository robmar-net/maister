name: Build Copilot CLI Variant
on:
  push:
    branches: [master, v2]
    # Everything the build reads or is gated by. plugins/maister/** + platforms/**
    # are the build INPUTS; Makefile carries the `validate` rules and the build/determinism
    # targets; the workflow file itself so changes to the gate are exercised on push.
    # (plugins/maister-copilot/** is intentionally excluded — it is generated output, so a
    # rebuild commit can't self-retrigger this workflow.)
    paths:
      - 'plugins/maister/**'
      - 'platforms/**'
      - 'Makefile'
      - '.github/workflows/build-copilot.yml'
  # PRs targeting master/v2 run the full build+validate+determinism+drift gate. Deliberately
  # NO `paths:` filter here: `build` is a REQUIRED status check (branch protection), and a
  # path-filtered required check never reports on PRs that don't touch those paths — leaving
  # the PR stuck "expected" forever. Running the (fast) build on every PR keeps the required
  # check always-reporting. compat still self-skips on PRs (no seat secret on forks).
  pull_request:
    branches: [master, v2]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Copilot CLI variant
        run: make build

      - name: Validate build
        run: make validate

      - name: Check build determinism
        # Two consecutive builds on this runner must be byte-identical. This protects the
        # drift guard below (a non-deterministic build would make `git diff --exit-code`
        # flaky) and the SkillPanel auto-commit (which would otherwise churn "Rebuild"
        # commits). NOTE: this proves SAME-machine determinism only — it does not prove
        # cross-OS (macOS↔Linux) byte-identity, which the drift guard also assumes; the
        # build is written for that (LC_ALL=C sort, perl -0pi, portable sedi) but it is not
        # gated here. Add a macOS matrix leg if that ever needs enforcing.
        run: make check-deterministic

      - name: Commit if changed
        # Canonical-repo only: auto-committing the rebuilt variant back to master is a
        # maintainer operation on the upstream repo. On forks the default GITHUB_TOKEN is
        # read-only (push → 403) and the fork's master is just a PR-staging branch, so the
        # step is skipped there — build + validate above still run as normal fork CI.
        if: github.repository == 'SkillPanel/maister' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/maister-copilot/
          git diff --cached --quiet || git commit -m "Rebuild Copilot CLI variant"
          git push

      - name: Verify committed variant is in sync (fail on drift)
        # Everywhere the auto-commit above does NOT run (this repo, and forks): the rebuilt
        # variant is never committed by CI, so a contributor who edits plugins/maister/** or
        # platforms/** but forgets to `make build` would otherwise merge a STALE
        # plugins/maister-copilot/** with the job still GREEN — `make validate` runs against
        # the freshly-rebuilt working tree, never against the committed bytes. This guard turns
        # that drift into a red check: `make build` already ran above, so any diff here means
        # the committed variant is out of date. (Relies on the same cross-platform build
        # determinism the SkillPanel auto-commit already depends on to stay a no-op.)
        if: github.repository != 'SkillPanel/maister'
        run: |
          git diff --exit-code -- plugins/maister-copilot/ || {
            echo "::error::Committed plugins/maister-copilot/ is stale relative to plugins/maister/** + platforms/**. Run 'make build' and commit the regenerated variant."
            exit 1
          }

  # ---------------------------------------------------------------------------
  # WS6 — Runtime compatibility gate (invokes the committed WS7 harness in CI)
  #
  # `make validate` (build job) proves STATIC conventions only. Proving the
  # generated plugin actually LOADS and REGISTERS in a real GitHub Copilot CLI
  # requires the WS7 harness (`make test-copilot`), which needs the Copilot CLI
  # installed AND AUTHENTICATED (a seat) with experimental features enabled —
  # even the `--no-live` subset issues a live `plugin list`. A vanilla GitHub
  # runner has none of this, so this gate runs in two modes:
  #
  #   • Seat provisioned  → install + authenticate the Copilot CLI, run the full
  #     WS7 harness, FAIL the build on any RED contract, and upload the
  #     timestamped report as the run's evidence.
  #   • No seat (default) → SKIP the harness with a clear log line. `make build`
  #     + `make validate` (build job) still run and gate exactly as before. This
  #     degraded mode is a DOCUMENTED ACCEPTED LIMITATION: it does NOT prove the
  #     runtime-registration criterion — it only defers it to a local
  #     `make test-copilot` run.
  #
  # ── To ENABLE the full runtime gate (maintainer, one-time) ──────────────────
  #   1. Provision a GitHub Copilot seat usable by the CLI and obtain a
  #      non-interactive CLI auth token (or a pre-authenticated
  #      ~/.copilot/config.json payload).
  #   2. Add it as an Actions secret named COPILOT_CLI_TOKEN
  #      (repo/org → Settings → Secrets and variables → Actions).
  #   3. IMPLEMENT the auth handshake in the "Install & authenticate" step below
  #      (it is a TODO placeholder today — `copilot --version` works WITHOUT auth,
  #      so an un-wired handshake yields an unauthenticated live session and
  #      run.sh exits non-zero = RED). Match GitHub's current Copilot CLI auth
  #      mechanism and enable experimental features (required for `--plugin-dir`).
  #   4. Set the repo/org Actions VARIABLE COPILOT_COMPAT_LIVE=true to opt in.
  #   The gate activates only when the secret AND vars.COPILOT_COMPAT_LIVE=true are
  #   BOTH set — so merely adding the secret can NOT red the build before step 3 is
  #   done. The full run consumes a few AI credits per push (one scripted live
  #   session). Reports are uploaded as build artifacts only — never committed.
  # ---------------------------------------------------------------------------
  compat:
    name: Copilot CLI compat harness (WS7)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect Copilot seat
        id: seat
        env:
          COPILOT_CLI_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
          COPILOT_COMPAT_LIVE: ${{ vars.COPILOT_COMPAT_LIVE }}
        run: |
          # Live mode requires BOTH: the seat secret AND an explicit opt-in variable. The
          # opt-in exists because the "Install & authenticate" step's handshake is a MAINTAINER
          # TODO (see below) — without it a live session is unauthenticated and run.sh exits
          # non-zero (RED). Gating on the secret alone would mean simply *adding* the secret
          # flips CI red before the handshake is wired; the explicit vars.COPILOT_COMPAT_LIVE
          # opt-in prevents that. Default (either unset) → SKIP, green, static gate unchanged.
          if [ -n "$COPILOT_CLI_TOKEN" ] && [ "$COPILOT_COMPAT_LIVE" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Live compat gate enabled (COPILOT_CLI_TOKEN set and vars.COPILOT_COMPAT_LIVE=true) — running the full WS7 runtime compatibility harness."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo 'Copilot CLI compat harness skipped — live gate not enabled (needs the COPILOT_CLI_TOKEN secret AND vars.COPILOT_COMPAT_LIVE=true, plus a real auth handshake in the Install step). `make validate` covers static conventions; run `make test-copilot` locally.'
          fi

      - name: Install & authenticate GitHub Copilot CLI
        if: steps.seat.outputs.present == 'true'
        env:
          COPILOT_CLI_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
        run: |
          # Install the Copilot CLI (baseline 1.0.73). ubuntu-latest ships Node.js.
          npm install -g @github/copilot
          mkdir -p "$HOME/.copilot"
          # MAINTAINER: complete the auth handshake for the provisioned seat here —
          # e.g. materialize $COPILOT_CLI_TOKEN into ~/.copilot/config.json or run
          # the CLI's non-interactive login flow — and enable experimental features
          # (required for --plugin-dir). After this, `copilot --version` must work:
          copilot --version

      - name: Run WS7 compatibility harness (fail the build on any red contract)
        if: steps.seat.outputs.present == 'true'
        env:
          COPILOT_CLI_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
        # `make test-copilot` = `make build` + run.sh (full live mode). run.sh
        # writes its report under platforms/copilot-cli/compat-tests/reports/
        # (git-ignored) and exits non-zero on any RED contract, failing this job.
        run: make test-copilot

      - name: Upload compatibility report (evidence)
        # Upload even when the harness goes RED (the report IS the evidence);
        # skipped entirely in the no-seat mode. Reports are artifacts only —
        # they are never `git add`-ed, so the build job's auto-commit stays a no-op.
        if: ${{ always() && steps.seat.outputs.present == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: copilot-compat-report
          path: platforms/copilot-cli/compat-tests/reports/compat-report-*.md
          if-no-files-found: warn
