# Real-shape sample of a Copilot 1.0.81 orchestrator-state.yml (DEVELOPMENT workflow). Captured from
# the 2026-08-28 live L2 run (rundir l2-rundir-2UuqAM). A THIRD serialization variant: NO
# `completed_phases` array, and `phase_summaries` is keyed by NAMED phases (codebase_analysis,
# clarifications, …) NOT `phase-N` — so the only machine-readable completion record is a `phases:`
# SEQUENCE of `{ id: N, name, status: completed }`. Guards the parseState fallback (derive phases from
# that sequence) against regression; without it the sanity floor trips to a false INCOMPLETE.
