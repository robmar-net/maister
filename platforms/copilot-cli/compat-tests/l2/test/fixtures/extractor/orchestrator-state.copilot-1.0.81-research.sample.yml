# Real-shape sample of a Copilot 1.0.81 orchestrator-state.yml (RESEARCH workflow). Captured from the
# 2026-08-27 live L2 run (rundir l2-rundir-97Ckto). Copilot's model serialized this run with NO
# `completed_phases` key at all: completed phases live ONLY as a `phase_summaries:` MAP with `phase-N:`
# entry keys (each carrying a summary/artifacts/steps_completed), under `research_context`, with
# `orchestrator.phase: complete`. Guards the parseState fallback (derive phases from phase_summaries
# phase-N keys when no completed_phases array exists) against regression — without it the sanity floor
# trips to a false INCOMPLETE even though the workflow completed.
